<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>Página não encontrada</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: dark; }
  html, body { background-color: #000000; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .glass { background: rgba(255,255,255,0.025); backdrop-filter: blur(12px) saturate(140%); -webkit-backdrop-filter: blur(12px) saturate(140%); border: 1px solid rgba(255,255,255,0.06); }
  .orb { position:absolute; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(37,211,102,0.10) 0%, transparent 70%); filter: blur(60px); pointer-events:none; z-index:0; }
  .fade-in { animation: fadeIn .45s ease-out both; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
  .accent-bar { background: linear-gradient(90deg, transparent, #25D366, transparent); }
</style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden">
<div class="orb" style="top:-120px; left:-120px;"></div>
<div class="orb" style="bottom:-140px; right:-120px;"></div>
<main class="relative z-10 flex-1 flex items-center justify-center px-5 py-10">
  <section class="glass rounded-2xl w-full max-w-md px-7 py-12 text-center fade-in">
    <h1 class="text-5xl font-bold text-white">404</h1>
    <div class="accent-bar h-px w-20 mx-auto my-5"></div>
    <p class="text-gray-300 text-base md:text-lg">Página não encontrada</p>
    <p class="mt-2 text-gray-500 text-sm">Acesse pelo link de atendimento da sua região.</p>
  </section>
</main>
<footer class="relative z-10 py-6 text-center text-gray-600 text-xs px-4">&copy; 2026. Todos os direitos reservados.</footer>
</body>
</html>
